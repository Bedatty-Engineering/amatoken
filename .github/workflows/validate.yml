---
name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write
  packages: read
  actions: read

jobs:
  base:
    name: Base validation
    uses: Bedatty-Engineering/modules-hub/.github/workflows/validate.yml@stable
    secrets: inherit
    with:
      is_pull_request: ${{ github.event_name == 'pull_request' }}
      enforce_source_branches: true
      allowed_source_branches: "dev|hotfix/*"
      target_branches_for_source_check: "main"
